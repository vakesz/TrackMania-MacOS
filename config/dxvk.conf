# MacTMNF - DXVK tuning for TMNF on Apple Silicon (MoltenVK).
# Remaining tuning overrides are retained pending controlled frame-time measurements.

# Compile pipelines in the background instead of stalling the render thread.
# Draws that need an unfinished async pipeline can be skipped, causing temporary
# missing geometry or effects while shaders compile.
dxvk.enableAsync = True

# For host-visible buffers, request host-cached memory and drop the device-local
# requirement. MoltenVK chooses the memory type; a TMNF benefit is not yet measured.
d3d9.cachedDynamicBuffers = True

# Request device-local constant buffers. Apple Silicon uses unified memory;
# this is not a move to dedicated VRAM or a demonstrated speedup.
d3d9.deviceLocalConstantBuffers = True

# Limit queued frames to one. Latency/throughput effects still need measurement.
d3d9.maxFrameLatency = 1

# Leave presentation interval to the game's vsync setting. Direct buffer mapping
# already defaults to enabled in the pinned D9VK, so neither needs an override.

# The 2008 launcher looks the GPU up in GfxDevicePerfs.txt by PCI ID. Apple
# GPUs are not listed, so it runs TmForever.exe /bench, which never completes
# under Rosetta. Report a GeForce 8800 GT to the launcher only; the game itself
# still sees the real adapter. Everything below applies to this executable only.
[TmForeverLauncher.exe]
d3d9.customVendorId = 10de
d3d9.customDeviceId = 0611
