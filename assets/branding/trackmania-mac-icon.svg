<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">TrackMania Mac</title>
  <desc id="description">An original midnight racing-route icon with a cyan circuit, mint start light, and coral apex.</desc>
  <defs>
    <linearGradient id="backdrop" x1="130" y1="80" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16314C"/>
      <stop offset="0.52" stop-color="#0A1C30"/>
      <stop offset="1" stop-color="#06101E"/>
    </linearGradient>
    <linearGradient id="route" x1="210" y1="780" x2="850" y2="250" gradientUnits="userSpaceOnUse">
