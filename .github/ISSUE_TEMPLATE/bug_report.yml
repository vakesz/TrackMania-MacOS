name: Bug report
description: Something is broken when installing, updating or playing a title.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        In the TrackMania Mac app, select the title and choose **Create diagnostics report**.
        It writes a redacted zip to `~/Library/TrackManiaMacOS/logs`; attach it below.
        From a source checkout, `./src/shell/cli/trackmania-mac diagnostics` does the same.
        For a security problem, use the security policy instead of a public issue.
  - type: dropdown
    id: title
    attributes:
      label: Title
      options:
        - TrackMania Nations Forever
        - TrackMania United Forever
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong. Paste exact error text or add a screenshot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TrackMania Mac version
      description: Shown in the app's About window (TrackMania Mac > About).
      placeholder: e.g. 0.4.3
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: e.g. macOS 15.1, M1 Pro
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed
      options:
        - TrackMania Mac app (release download)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Drag the diagnostics zip here. If you can't create one, paste the output of `./src/shell/cli/trackmania-mac doctor` instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From ~/Library/TrackManiaMacOS/logs (play.log, or <title>-play.log for other titles). Trim long files.
      render: text
    validations:
      required: false
