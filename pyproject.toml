# Python tooling: pytest for tests, ruff for lint. [project] version is the
# release version; uv.lock mirrors it, so run `uv lock` after a bump
# (tests/test_project.py enforces the sync). This repo is not pip-installed --
# [tool.uv] package = false -- the .app bundles the scripts directly. Resolve
# with `uv lock`, run with `uv run --frozen --group <name> ...`.
[project]
name = "trackmania-mac"
version = "0.5.0"
description = "TrackMania for Apple Silicon"
requires-python = ">=3.9"

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff>=0.17"]
typecheck = ["mypy>=1.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# uv/pytest do not put the checkout on sys.path like `python -m` does.
pythonpath = ["src/python"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "S602", "S605"]

[tool.mypy]
# Current mypy no longer accepts 3.9, so this is the lowest target it can
# check. The code still runs on 3.9 (requires-python); ruff target-version
# and the test suite cover that side.
python_version = "3.10"
files = ["src/python/trackmania_mac"]
# trackmania_mac is not installed; resolve it from src/python as pytest does.
mypy_path = ["src/python"]
check_untyped_defs = true
