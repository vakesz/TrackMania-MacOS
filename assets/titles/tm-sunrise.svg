<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Sunrise</title>
  <desc id="description">An original icon of a rising sun with short rays over a dusk horizon, with a winding road sweeping toward it, in coral and gold over plum.</desc>
  <defs>
    <linearGradient id="backdrop" x1="130" y1="80" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A1D5C"/>
      <stop offset="0.55" stop-color="#2B1140"/>
      <stop offset="1" stop-color="#150822"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="770" x2="650" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC46B"/>
      <stop offset="1" stop-color="#FF6A4D"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0A0"/>
      <stop offset="1" stop-color="#FF9A3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.95">
      <stop stop-color="#FF7A59" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="48" y="48" width="928" height="928" rx="218"/></clipPath>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="218" fill="url(#backdrop)"/>
  <rect x="62" y="62" width="900" height="900" rx="204" fill="none" stroke="#FFD9B8" stroke-opacity="0.22" stroke-width="8"/>
  <ellipse cx="512" cy="210" rx="425" ry="340" fill="url(#glow)" clip-path="url(#tile)"/>
  <rect x="48" y="540" width="928" height="436" fill="#12051C" fill-opacity="0.55" clip-path="url(#tile)"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 540 A170 170 0 0 1 682 540 Z" fill="url(#spark)" stroke="none"/>
    <path d="M512 290 V230 M392 340 L350 298 M632 340 L674 298 M300 460 L240 440 M724 460 L784 440" stroke="#FFD98A" stroke-width="22"/>
    <path d="M265 765 C380 765 480 745 560 690 C600 662 630 640 645 610" stroke="#12051C" stroke-width="210"/>
    <path d="M265 765 C380 765 480 745 560 690 C600 662 630 640 645 610" stroke="url(#accent)" stroke-width="150"/>
    <path d="M265 765 C380 765 480 745 560 690 C600 662 630 640 645 610" stroke="#3A1650" stroke-width="86"/>
    <path d="M265 765 C380 765 480 745 560 690 C600 662 630 640 645 610" stroke="#FFF3E0" stroke-opacity="0.85" stroke-width="12" stroke-dasharray="40 36"/>
  </g>
</svg>
