<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <title>Page Not Found - TrackMania Mac</title>
    <!-- Self-contained on purpose: a 404 can be served from any path, so relative URLs would break. -->
    <style>
      :root { color-scheme: light dark; --bg: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #0066cc; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #f5f5f7; --muted: #a1a1a6; --accent: #2997ff; } }
      body { margin: 0; padding: 18vh 24px; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
      main { width: min(52ch, 100%); margin-inline: auto; }
      h1 { margin: 0 0 12px; font-size: clamp(32px, 7vw, 56px); line-height: 1.05; letter-spacing: -0.03em; }
      p { margin: 0 0 12px; color: var(--muted); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Page Not Found</h1>
      <p>That address does not exist on this site.</p>
      <p><a href="/TrackMania-MacOS/">Return to TrackMania Mac</a></p>
    </main>
  </body>
</html>
