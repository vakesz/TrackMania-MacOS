name: Bug report
description: Something is broken when installing, updating or playing a title.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        In the app, choose **Help > Report a Problem...** (or **Report a Problem...** on a failed action).
        It saves a redacted diagnostics zip, shows it in Finder and opens this form with the versions
        and a short checks summary filled in. GitHub can't attach a file from a link, so drag the zip
        into **Diagnostics report** below.
        From a source checkout, `./src/shell/cli/trackmania-mac diagnostics` creates the zip and prints the form link.
        For a security problem, use the security policy instead of a public issue.
        Titles marked unsupported are not expected to run yet: please don't report that one doesn't work.
        Issues and pull requests that help one run are welcome.
  - type: dropdown
    id: title
    attributes:
      label: Title
      options:
        - TrackMania Nations Forever
        - TrackMania United Forever
        - TrackMania Nations ESWC
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong. Paste exact error text or add a screenshot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TrackMania Mac version
      description: Shown in the app's About window (TrackMania Mac > About).
      placeholder: e.g. 0.4.3
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: Filled in by Report a Problem. Otherwise use the version shown by `trackmania-mac doctor`, or leave it empty.
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: e.g. macOS 15.1 (24B83), Apple M1 Pro
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed
      options:
        - TrackMania Mac app (release download)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Drag the diagnostics zip here. If you can't create one, paste the output of `./src/shell/cli/trackmania-mac doctor` instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Checks summary
      description: Filled in by Report a Problem. The full output is in the diagnostics report.
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From ~/Library/TrackManiaMacOS/logs (play.log, or <title>-play.log for other titles). Trim long files.
      render: text
    validations:
      required: false
