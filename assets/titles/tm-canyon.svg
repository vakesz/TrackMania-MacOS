<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Canyon</title>
  <desc id="description">An original icon of layered canyon cliffs with a winding road and a low sun, in terracotta and sand.</desc>
  <defs>
    <linearGradient id="backdrop" x1="130" y1="80" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5E2A1D"/>
      <stop offset="0.55" stop-color="#35160F"/>
      <stop offset="1" stop-color="#1D0A06"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="820" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD9B0"/>
      <stop offset="1" stop-color="#E8743B"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0A8"/>
      <stop offset="1" stop-color="#FFB43B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.95">
      <stop stop-color="#D2582B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D2582B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="48" y="48" width="928" height="928" rx="218"/></clipPath>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="218" fill="url(#backdrop)"/>
  <rect x="62" y="62" width="900" height="900" rx="204" fill="none" stroke="#FFD9B0" stroke-opacity="0.22" stroke-width="8"/>
  <ellipse cx="512" cy="210" rx="425" ry="340" fill="url(#glow)" clip-path="url(#tile)"/>
  <circle cx="512" cy="360" r="120" fill="url(#spark)" opacity="0.95"/>
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M110 740 L110 560 L250 430 L330 520 L470 360 L560 470 L690 330 L800 450 L914 380 L914 740 Z" fill="#7A3A22"/>
    <path d="M110 790 L110 640 L230 560 L350 650 L500 520 L640 640 L770 560 L914 660 L914 790 Z" fill="#9E4B2B"/>
    <path d="M110 840 L110 740 L260 690 L420 760 L560 700 L720 770 L914 710 L914 840 Z" fill="#C4673A"/>
  </g>
  <path d="M600 900 C560 840 380 830 420 770 C460 715 640 740 600 690" fill="none" stroke="url(#accent)" stroke-width="40" stroke-linecap="round" stroke-dasharray="6 70"/>
</svg>
