# MacTMNF - DXVK tuning for TMNF on Apple Silicon (MoltenVK).
# TMNF is a 2008 D3D9 title: single-threaded renderer, dynamic vertex buffers
# locked every frame, and shaders compiled during play. Each of these is far
# more expensive under Rosetta + WoW64 than on native Windows.

# Compile pipelines in the background instead of stalling the render thread.
dxvk.enableAsync = True

# Keep dynamic buffers in cached memory. D3D9 games that Lock() vertex buffers
# every frame otherwise hit write-combined memory, which is very slow here.
d3d9.cachedDynamicBuffers = True

# Let the driver map buffers directly rather than staging through a copy.
d3d9.allowDirectBufferMapping = True

# Constant buffers in device-local memory; TMNF updates these constantly.
d3d9.deviceLocalConstantBuffers = True

# Don't let the CPU queue frames ahead - lower latency, less perceived lag.
d3d9.maxFrameLatency = 1

# Present without waiting on vsync.
d3d9.presentInterval = 0

# The 2008 launcher looks the GPU up in GfxDevicePerfs.txt by PCI ID. Apple
# GPUs are not listed, so it runs TmForever.exe /bench, which never completes
# under Rosetta. Report a GeForce 8800 GT to the launcher only; the game itself
# still sees the real adapter. Everything below applies to this executable only.
[TmForeverLauncher.exe]
d3d9.customVendorId = 10de
d3d9.customDeviceId = 0611
