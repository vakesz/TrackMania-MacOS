<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Nations Forever</title>
  <desc id="description">An original icon of a pennant on a banked ribbon road, in cool cyan and mint over midnight blue.</desc>
  <defs>
    <linearGradient id="backdrop" x1="130" y1="80" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16314C"/>
      <stop offset="0.55" stop-color="#0A1C30"/>
      <stop offset="1" stop-color="#06101E"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="820" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FFF0"/>
      <stop offset="1" stop-color="#27B9F8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB076"/>
      <stop offset="1" stop-color="#FA5A75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.95">
      <stop stop-color="#2D8CAD" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2D8CAD" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="48" y="48" width="928" height="928" rx="218"/></clipPath>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="218" fill="url(#backdrop)"/>
  <rect x="62" y="62" width="900" height="900" rx="204" fill="none" stroke="#B8FFF0" stroke-opacity="0.22" stroke-width="8"/>
  <ellipse cx="512" cy="210" rx="425" ry="340" fill="url(#glow)" clip-path="url(#tile)"/>
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 800 C330 760 470 700 560 610 C650 520 700 430 840 360" fill="none" stroke="#03101D" stroke-width="210"/>
    <path d="M190 800 C330 760 470 700 560 610 C650 520 700 430 840 360" fill="none" stroke="url(#accent)" stroke-width="150"/>
    <path d="M190 800 C330 760 470 700 560 610 C650 520 700 430 840 360" fill="none" stroke="#092338" stroke-width="84"/>
    <path d="M190 800 C330 760 470 700 560 610 C650 520 700 430 840 360" fill="none" stroke="#F1FFF8" stroke-opacity="0.9" stroke-width="12" stroke-dasharray="46 40"/>
    <path d="M300 430 V190" stroke="#E8FFFA" stroke-width="22" fill="none"/>
    <path d="M311 200 L520 262 L311 340 Z" fill="url(#spark)"/>
  </g>
</svg>
